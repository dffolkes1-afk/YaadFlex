<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackRock Executive - YaadFlex Global | CEO Profile</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f3f2ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            width: 450px;
            height: 500px;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            position: relative;
        }
        .avatar {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 72px;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(255,215,0,0.4);
        }
        .name {
            font-size: 28px;
            color: white;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .blackrock-badge {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #2c3e50;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .title {
            font-size: 20px;
            color: #FFD700;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .company {
            font-size: 18px;
            color: #ecf0f1;
            font-weight: 400;
        }
        .flag {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <span class="flag">🇯🇲</span>
        <div class="avatar">CEO</div>
        <div class="blackrock-badge">BlackRock Portfolio</div>
        <div class="name">BlackRock Executive</div>
        <div class="title">Chief Executive Officer</div>
        <div class="company">YaadFlex Global</div>
        <div style="font-size: 16px; color: #bdc3c7; margin-top: 8px; font-weight: 500;">
            A BlackRock Portfolio Company
        </div>
        <div style="font-size: 14px; color: #95a5a6; margin-top: 5px; font-style: italic;">
            The Fair Alternative
        </div>
    </div>
</body>
</html>
